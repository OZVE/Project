<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Aplicación{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- 🔹 NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Oz AI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    {% if session.get('user_id') %}
                        <li class="nav-item"><a class="nav-link" href="#">Wellcome, {{ session.get('user_name', 'Usuario') }}</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('lista_conversaciones') }}">History</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.logout') }}">Logout</a></li>
                        <li class="nav-item"><a href="{{ url_for('new_conversation') }}" class="btn btn-outline-success">New Chat</a></li>

                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.login') }}">Login</a></li>
                        <li class="nav-item"><a class="nav-link" href="{{ url_for('auth.signup') }}">Singup</a></li>
                    {% endif %}  
                </ul>
            </div>
        </div>
    </nav>

    <!-- 🔹 CONTENIDO DINÁMICO -->
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>

    <!-- 🔹 FOOTER -->
    <footer class="bg-light text-center py-3">
        <p class="mb-0">&copy; 2024 Oz AI. All Rigths Reserved.</p>
    </footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.4/socket.io.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
