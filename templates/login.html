{% extends 'layout.html' %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="card shadow-lg mx-auto p-4" style="max-width: 400px;">
    <div class="card-header bg-success text-white border-succes text-center">🔐 Iniciar Sesión</div>
    <div class="card-body">
        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Ingresa tu correo" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-outline-success w-100">Ingresar</button>
        </form>
    </div>
    <div class="card-footer text-center">
        <p class="mb-0">¿No tienes una cuenta? <a href="{{ url_for('auth.signup') }}">Regístrate</a></p>
    </div>
</div>
{% endblock %}
